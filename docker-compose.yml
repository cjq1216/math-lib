services:
  backend:
    build: ./backend
    container_name: math-bank-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      MEDIA_BASE_URL: /static
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    container_name: math-bank-frontend
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
